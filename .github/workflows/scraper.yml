name: Room Scraper — Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        working-directory: backend
        env:
          SWKA_EMAIL:    ${{ secrets.SWKA_EMAIL }}
          SWKA_PASSWORD: ${{ secrets.SWKA_PASSWORD }}
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
          HEADLESS:      "true"
        run: python scrapers/swka.py
